name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ -d "/home/${{ secrets.EC2_USER }}/Form-Builder" ]; then
              cd "/home/${{ secrets.EC2_USER }}/Form-Builder"
            elif [ -d "/home/${{ secrets.EC2_USER }}/form-builder" ]; then
              cd "/home/${{ secrets.EC2_USER }}/form-builder"
            else
              echo "Project directory not found!" && exit 1
            fi

            # 2. Ensure persistent storage folder exists on host
            mkdir -p /home/${{ secrets.EC2_USER }}/app_storage

            echo "Pulling latest changes from main..."
            git pull origin main

            echo "Building optimized Docker image..."
            docker build -t form-builder .

            echo "Restarting application container..."
            docker stop Form-Builder 2>/dev/null || true
            docker rm Form-Builder 2>/dev/null || true

            docker run -d \
              --name Form-Builder \
              --restart unless-stopped \
              -p 80:80 \
              --env-file .env \
              -v /home/${{ secrets.EC2_USER }}/app_storage:/var/www/html/storage/app/public \
              form-builder

            echo "Pruning unused docker images..."
            docker image prune -f

            echo "🚀 Deployment completed successfully!"
